name: DemoApp
options:
  bundleIdPrefix: com.fintrust
targets:
  DemoApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - DemoApp
    dependencies:
      - package: FinTrustConsent
    settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.fintrust.consentsdktest
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: "This app connects to a local server during development to test cookie consent."
packages:
  FinTrustConsent:
    path: ../
