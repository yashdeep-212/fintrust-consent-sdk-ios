name: DemoApp
options:
  bundleIdPrefix: com.fintrust
targets:
  DemoApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - DemoApp
    dependencies:
      - package: FinTrustConsent
    info:
      path: Info.plist
      properties:
        UILaunchScreen: {}
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: "This app connects to a local server during development to test cookie consent."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fintrust.consentsdktest
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
packages:
  FinTrustConsent:
    path: ../
